name: BedWars1058
api-version: '1.13'
version: ${project.version}
author: andrei1058
description: BedWars minigame by andrei1058
main: com.andrei1058.bedwars.BedWars
softdepend: [Vault,PlaceholderAPI,Citizens,Parties,SlimeWorldManager,VipFeatures,Enhanced-SlimeWorldManager,PartyAndFriends,Spigot-Party-API-PAF,ProtocolLib,ViaVersion,ProtocolSupport]
#load: STARTUP

# Commands and permissions of the built-in features (see plugins/BedWars1058/Features).
# The /bw and /party commands are registered by the plugin itself.
commands:
  # MapLoader
  bwloader:
    description: Manage BedWars map loading
    usage: /<command> help
    aliases: [bwl, maploader, bedwarsloader]
    permission: bw1058maploader.admin
  # MultiGroup
  bwmg:
    description: Manage the groups and configurations of BedWars maps
    usage: /<command> help
    aliases: [bwmultigroup, multigroup]
    permission: bw1058multigroup.admin
  # ArenaManagement
  arenamanagement:
    description: Reload or inspect BedWars1058-ArenaManagement.
    usage: /arenamanagement <reload|menu|gui [group]>
    aliases: [bwam]
  # EasySetup
  bwsetup:
    description: Start hotbar setup mode and open the setup menu.
    usage: /bwsetup [open|exit|tools|page <team|map>|mode|gamemode|facing|snap|pitch|import|delete|list|next|help|reload|status|reset]
    aliases: [bwa, bwautosetup]
    permission: bwauto.use
  bwauto:
    description: Run automatic placement, or confirm/deny it when elements are missing.
    usage: /bwauto [run|next|confirm|deny|gens]
    permission: bwauto.use
  nextgen:
    description: Detect and place the next diamond/emerald generator, or rotate around the map centre.
    usage: /nextgen [diamond|emerald] [degrees]
    aliases: [bwrotate]
    permission: bwauto.use
  # GeneralFixes
  bwfixes:
    description: Manage BedWars1058-GeneralFixes
    usage: /<command> [reload]
    aliases: [bwgf, bw1058fixes]
  # DragonFix
  bw-dragonfix:
    description: Admin command for BedWars1058-DragonFix.
    usage: /bw-dragonfix <reload | status | config ...>
    aliases: [bwdf]
    permission: dragonfix.admin
  # InvisFix
  bw-invisfix:
    description: Admin command for BedWars1058-InvisFix.
    usage: /bw-invisfix <reload | status | config ...>
    aliases: [bwif]
    permission: invisfix.admin
  # Compass
  bwcompass:
    description: BedWars1058-Compass admin command
    usage: /bwcompass [status|reload|config]
  # Revive
  revive:
    description: Revive / join a running BedWars game on any team.
    usage: /<command> <team> [bed|nobed] [arena] | bed | set | eliminate | teams | reload
    aliases: [bwrevive]
  # MobSpawn
  mobspawn:
    description: Open the mob spawner UI and manage mobs.
    usage: /<command> [spawn|edit|delete|cancel|clear|reload|help]
    aliases: [mobs, bwmob]
permissions:
  # MapLoader
  bw1058maploader.admin:
    description: Use /bwloader (status, reload, config, migrate)
    default: op
  # MultiGroup
  bw1058multigroup.admin:
    description: Use /bwmg
    default: op
  # ArenaManagement
  arenamanagement.admin:
    description: Allows /arenamanagement reload.
    default: op
  # EasySetup
  bwauto.use:
    description: Use the Bedwars auto-setup tools.
    default: op
  # GeneralFixes
  bwfixes.admin:
    description: Allows /bwfixes reload
    default: op
  # DragonFix
  dragonfix.admin:
    default: op
  # InvisFix
  invisfix.admin:
    default: op
  # Compass
  bwcompass.admin:
    description: Everything under /bwcompass
    default: op
    children:
      bwcompass.reload: true
      bwcompass.config: true
  bwcompass.reload:
    description: Allows /bwcompass reload
    default: false
  bwcompass.config:
    description: Allows /bwcompass config (editing config.yml in game)
    default: false
  # Revive
  bwrevive.use:
    description: Use /revive on a team.
    default: op
  bwrevive.outsider:
    description: Use /revive to join a game you were never part of.
    default: op
  bwrevive.bed:
    description: Choose to have the team's bed restored when reviving.
    default: op
  bwrevive.switch:
    description: Switch teams with /revive while alive.
    default: op
  bwrevive.admin:
    description: Reload the plugin configuration.
    default: op
  bwrevive.admin.bed:
    description: Recreate any team's bed at any time (/revive bed <team>).
    default: op
  bwrevive.admin.move:
    description: Put other players on a team (/revive set).
    default: op
  bwrevive.admin.eliminate:
    description: Put a player into the dead-spectator role (/revive eliminate).
    default: op
  bwrevive.*:
    description: All BedWars1058-Revive permissions.
    default: op
    children:
      bwrevive.use: true
      bwrevive.outsider: true
      bwrevive.bed: true
      bwrevive.switch: true
      bwrevive.admin: true
      bwrevive.admin.bed: true
      bwrevive.admin.move: true
      bwrevive.admin.eliminate: true
  # MobSpawn
  mobspawn.use:
    description: Spawn, configure targeting/timers of and delete mobs.
    default: op
  mobspawn.admin:
    description: Edit mob attributes, clear all mobs and reload the config.
    default: op
