name: BedWars1058
api-version: '1.13'
version: ${project.version}
author: andrei1058
description: BedWars minigame by andrei1058
main: com.andrei1058.bedwars.BedWars
softdepend: [Vault,PlaceholderAPI,Citizens,Parties,SlimeWorldManager,VipFeatures,Enhanced-SlimeWorldManager,PartyAndFriends,Spigot-Party-API-PAF,ViaVersion,ProtocolSupport]
#load: STARTUP

# Commands and permissions of the built-in features (see plugins/BedWars1058/Features).
# The /bw and /party commands are registered by the plugin itself.
commands:
  # MapLoader
  bwloader:
    description: Manage BedWars map loading
    usage: /<command> help
    aliases: [bwl, maploader, bedwarsloader]
    permission: bw1058maploader.admin
  # MultiGroup
  bwmg:
    description: Manage the groups and configurations of BedWars maps
    usage: /<command> help
    aliases: [bwmultigroup, multigroup]
    permission: bw1058multigroup.admin
  # ArenaManagement
  arenamanagement:
    description: Reload or inspect BedWars1058-ArenaManagement.
    usage: /arenamanagement <reload|menu|gui [group]>
    aliases: [bwam]
  # EasySetup
  bwsetup:
    description: Start hotbar setup mode and open the setup menu.
    usage: /bwsetup [open|exit|tools|page <team|map>|mode|gamemode|facing|snap|pitch|import|delete|list|next|help|reload|status|reset]
    aliases: [bwa, bwautosetup]
    permission: bwauto.use
  bwauto:
    description: Run automatic placement, or confirm/deny it when elements are missing.
    usage: /bwauto [run|next|confirm|deny|gens]
    permission: bwauto.use
  nextgen:
    description: Detect and place the next diamond/emerald generator, or rotate around the map centre.
    usage: /nextgen [diamond|emerald] [degrees]
    aliases: [bwrotate]
    permission: bwauto.use
  # GeneralFixes
  bwfixes:
    description: Manage BedWars1058-GeneralFixes
    usage: /<command> [reload]
    aliases: [bwgf, bw1058fixes]
  # DragonFix
  bw-dragonfix:
    description: Admin command for BedWars1058-DragonFix.
    usage: /bw-dragonfix <reload | status | config ...>
    aliases: [bwdf]
    permission: dragonfix.admin
permissions:
  # MapLoader
  bw1058maploader.admin:
    description: Use /bwloader (status, reload, config, migrate)
    default: op
  # MultiGroup
  bw1058multigroup.admin:
    description: Use /bwmg
    default: op
  # ArenaManagement
  arenamanagement.admin:
    description: Allows /arenamanagement reload.
    default: op
  # EasySetup
  bwauto.use:
    description: Use the Bedwars auto-setup tools.
    default: op
  # GeneralFixes
  bwfixes.admin:
    description: Allows /bwfixes reload
    default: op
  # DragonFix
  dragonfix.admin:
    default: op
